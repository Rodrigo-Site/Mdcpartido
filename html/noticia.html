<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Notícia — MDC</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <header id="header" class="scrolled">
        <div class="nav-wrap">

            <a href="index.html" class="brand">
                <span class="logo">MDC</span>

                <span class="brand-text">
                    <strong>Movimento Democrático Central</strong>
                    <small>MDC</small>
                </span>
            </a>

            <nav class="desktop-nav">
                <a href="index.html">Início</a>
                <a href="noticias.html">Notícias</a>
                <a href="index.html#contato">Contato</a>
            </nav>

            <a class="header-btn" href="index.html#quem-somos">
                Conheça o MDC →
            </a>

        </div>
    </header>

    <main class="section" style="padding-top: 150px">

        <article class="container" style="max-width: 1000px">

            <a
                href="noticias.html"
                style="font-weight: 800; color: #71717a"
            >
                ← Todas as notícias
            </a>

            <div id="article"></div>

        </article>

    </main>

    <footer>
        <div class="copyright">
            © 2026 Movimento Democrático Central. Todos os direitos reservados.
        </div>
    </footer>

    <script>
        const data = [
            [
                1,
                "Educação",
                "MDC apresenta plano para ampliar formação técnica e tecnológica",
                "08 de agosto de 2026",
                "../image/presidente.png",
                [
                    "O partido apresentou uma proposta voltada à expansão do ensino técnico, da formação profissional e do acesso dos estudantes às novas tecnologias.",
                    "A agenda defende a aproximação entre escolas, universidades, centros de pesquisa e o setor produtivo, com foco em oportunidades de formação e inovação.",
                    "A proposta também destaca a importância de ampliar o acesso a ferramentas digitais e fortalecer ambientes de aprendizagem conectados às transformações do mercado de trabalho."
                ]
            ],

            [
                2,
                "Trabalho",
                "MDC debate medidas para estimular emprego e empreendedorismo",
                "06 de agosto de 2026",
                "https://images.unsplash.com/photo-1521737711867-e3b97375f902?auto=format&fit=crop&w=1600&q=85",
                [
                    "A proposta reúne iniciativas para reduzir burocracias, facilitar o acesso ao crédito e incentivar pequenos negócios.",
                    "O MDC defende medidas que favoreçam a abertura e a continuidade de empreendimentos, especialmente para quem está começando.",
                    "O objetivo é estimular a geração de renda e criar um ambiente mais favorável à inovação e à atividade produtiva."
                ]
            ],

            [
                3,
                "Saúde",
                "MDC propõe novas estratégias para reduzir filas na saúde pública",
                "04 de agosto de 2026",
                "https://images.unsplash.com/photo-1576091160399-112ba8d25d1d?auto=format&fit=crop&w=1600&q=85",
                [
                    "O plano destaca prevenção, tecnologia, integração de informações e melhoria da gestão dos serviços públicos.",
                    "Entre as diretrizes está o uso responsável de tecnologia para melhorar fluxos, facilitar o acesso a informações e apoiar a gestão.",
                    "A proposta também reforça a prevenção e a organização dos serviços como caminhos para melhorar o atendimento."
                ]
            ],

            [
                4,
                "Tecnologia",
                "MDC defende maior investimento em ciência, pesquisa e inovação",
                "02 de agosto de 2026",
                "https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=1600&q=85",
                [
                    "A proposta busca aproximar universidades, centros de pesquisa, empresas e poder público.",
                    "O MDC considera ciência, pesquisa e inovação instrumentos importantes para o desenvolvimento de soluções e para a competitividade brasileira.",
                    "A agenda propõe fortalecer conexões entre conhecimento, tecnologia e necessidades da sociedade."
                ]
            ],

            [
                5,
                "Sustentabilidade",
                "MDC apresenta agenda de sustentabilidade para o desenvolvimento brasileiro",
                "30 de julho de 2026",
                "../image/crianca.png",
                [
                    "A agenda reúne propostas relacionadas à reciclagem, energias renováveis, preservação ambiental e desenvolvimento sustentável.",
                    "A visão do MDC combina desenvolvimento e responsabilidade ambiental, buscando incentivar práticas sustentáveis e inovação.",
                    "A proposta também destaca educação ambiental, preservação e uso responsável dos recursos naturais."
                ]
            ]
        ];

        // Obtém o ID da notícia pela URL.
        // Exemplo: noticia.html?id=3
        const id = Number(
            new URLSearchParams(window.location.search).get("id") || 1
        );

        // Procura a notícia correspondente.
        // Caso não encontre, utiliza a primeira notícia.
        const noticia = data.find(item => item[0] === id) || data[0];

        // Gera os parágrafos da notícia.
        const paragrafos = noticia[5]
            .map(paragrafo => `
                <p
                    style="
                        font-size: 19px;
                        line-height: 1.8;
                        color: #3f3f46;
                    "
                >
                    ${paragrafo}
                </p>
            `)
            .join("");

        // Monta o conteúdo completo da notícia.
        document.getElementById("article").innerHTML = `
            <div
                class="eyebrow"
                style="margin-top: 45px"
            >
                ${noticia[1]}
            </div>

            <h1
                style="
                    font-size: clamp(42px, 6vw, 72px);
                    line-height: .98;
                    letter-spacing: -.05em;
                    margin: 10px 0;
                "
            >
                ${noticia[2]}
            </h1>

            <p style="color: #71717a">
                ${noticia[3]}
            </p>

            <img
                src="${noticia[4]}"
                 alt="${noticia[2]}"
                 class="${noticia[0] === 5 ? "imagem-sustentabilidade" : ""}"
                     style="
                        width: 100%;
                        height: auto;
                        max-height: 700px;
                        object-fit: contain;
                        background: #f3e8ff;
                        border-radius: 30px;
                        margin: 35px 0;
                        display: block;
"
>

            <div
                style="
                    max-width: 750px;
                    margin: auto;
                "
            >
                ${paragrafos}

                <button
                    class="btn primary"
                    id="shareButton"
                    type="button"
                >
                    ↗ Compartilhar
                </button>
            </div>
        `;

        // Compartilhamento
        const shareButton = document.getElementById("shareButton");

        shareButton.addEventListener("click", async () => {
            if (navigator.share) {
                try {
                    await navigator.share({
                        title: noticia[2],
                        text: noticia[2],
                        url: window.location.href
                    });
                } catch (error) {
                    // Usuário cancelou o compartilhamento.
                }
            } else {
                alert(
                    "O compartilhamento não está disponível neste navegador."
                );
            }
        });
    </script>

</body>

</html>
